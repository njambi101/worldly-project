<body>
<h3>cart quantity</h3>
<button onclick="console.log('Current quantity: ' + cartQuantity)">show quantity</button>
<button onclick="
  cartQuantity ++;
  console.log('Added to cart. Current quantity: ' + cartQuantity);
">add to cart</button>
<button onclick ="
  cartQuantity += 2;
  if (cartQuantity > 10) {
    alert('sorry your cart is full dont update the quantity.')
  } else {
    console.log('Added to cart. Current quantity: ' + cartQuantity);
  } 
 "
>+2</button>
<button onclick="
  cartQuantity += 3;
 "
>+3</button>
<button onclick="
  cartQuantity -= 2;
   if (cartQuantity < 0) {
    alert('not enough items in the cart')
  } else {
    console.log('Added to cart. Current quantity: ' + cartQuantity);
  } 
 "
>remove from cart</button>

  cartQuantity = 0;
  console.log('Cart reset. Current quantity: ' + cartQuantity);"
>reset cart</button>

let cartQuantity = 0;
