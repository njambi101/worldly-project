<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if-statement</title>
    
    </head>
    
    <body>
       
        <script>
            let grade =prompt("please enter your grade here:");
            let result = '';
            if(grade >= 90 && grade < 100){
                result = 'A'
            }else if(grade >= 75 && grade< 90){
                result = 'B'
            }else if(grade >= 65 && grade < 75){
                result = 'C'
            }else{
                result = 'D'
            }
            console.log(result)
        </script>
    </body>
    
    </html>

</html>
